name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

defaults:
  run:
    working-directory: fortop_platform

jobs:
  scan_ruby:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          working-directory: fortop_platform
          bundler-cache: true

      - name: Scan Rails code for security vulnerabilities
        run: bin/brakeman --quiet --no-pager

      - name: Audit Ruby dependencies
        run: bin/bundler-audit

  scan_js:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          working-directory: fortop_platform
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: fortop_platform/package-lock.json

      - name: Install syntax highlighter build dependencies
        run: npm ci --ignore-scripts

      - name: Verify syntax highlighter assets and grammars
        run: |
          npm run test:syntax
          npm run build:syntax
          git diff --exit-code -- public/syntax config/syntax_languages.json config/importmap.rb

      - name: Audit bundled JavaScript dependencies
        run: npm audit

      - name: Audit JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-24.04
    env:
      RUBOCOP_CACHE_ROOT: ${{ github.workspace }}/fortop_platform/tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          working-directory: fortop_platform
          bundler-cache: true

      - name: Cache RuboCop results
        uses: actions/cache@v4
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ hashFiles('fortop_platform/.ruby-version', 'fortop_platform/**/.rubocop.yml', 'fortop_platform/**/.rubocop_todo.yml', 'fortop_platform/Gemfile.lock') }}
          restore-keys: |
            rubocop-${{ runner.os }}-

      - name: Check Ruby style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-24.04
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fortop_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install system dependencies
        timeout-minutes: 5
        run: |
          # The Azure mirror can stall; use Ubuntu's primary HTTPS archive.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install --no-install-recommends -y libpq-dev libvips poppler-utils

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          working-directory: fortop_platform
          bundler-cache: true

      - name: Prepare test database
        run: bin/rails db:test:prepare

      - name: Check Rails autoloading
        run: bin/rails zeitwerk:check

      - name: Run tests with simulated external services
        run: bin/rails test

  system-test:
    runs-on: ubuntu-24.04
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fortop_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install system dependencies
        timeout-minutes: 5
        run: |
          # The Azure mirror can stall; use Ubuntu's primary HTTPS archive.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install --no-install-recommends -y libpq-dev libvips poppler-utils

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          working-directory: fortop_platform
          bundler-cache: true

      - name: Prepare test database
        run: bin/rails db:test:prepare

      - name: Run browser tests with simulated external services
        run: bin/rails test:system

      - name: Keep screenshots from failed browser tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: fortop_platform/tmp/screenshots
          if-no-files-found: ignore
