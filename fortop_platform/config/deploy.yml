<% require "json"; deployment = JSON.parse(File.read(File.expand_path("infra/gcp/production.json", Dir.pwd))) %>
service: fortop
image: <%= deployment.fetch("project") %>/fortop/platform
servers:
  web:
    hosts:
      - <%= deployment.fetch("ip") %>
    options:
      memory: 1g
  worker:
    hosts:
      - <%= deployment.fetch("ip") %>
    cmd: bin/jobs
    stop_timeout: 300
    options:
      memory: 1536m
      volume:
        - /run/user/2001:/run/fortop-sandbox:ro
    env:
      clear:
        DOCKER_HOST: unix:///run/fortop-sandbox/docker.sock
proxy:
  ssl: true
  host: <%= deployment.fetch("host") %>
  app_port: 80
  healthcheck:
    path: /up
    interval: 3
    timeout: 5
registry:
  server: <%= deployment.fetch("region") %>-docker.pkg.dev
  username: oauth2accesstoken
  password:
    - KAMAL_REGISTRY_PASSWORD
env:
  clear:
    APP_URL: https://<%= deployment.fetch("host") %>
    GOOGLE_CLOUD_PROJECT: <%= deployment.fetch("project") %>
    GOOGLE_CLOUD_LOCATION: <%= deployment.fetch("region") %>
    RAILS_LOG_LEVEL: info
    RAILS_MAX_THREADS: 3
    JOB_CONCURRENCY: 1
    GEMINI_MODEL: gemini-3.1-flash-lite
    VISIBILITY_GEMINI_MODEL: gemini-3.1-flash-lite
    VISIBILITY_DAILY_BUDGET_USD: 10
    VISIBILITY_MAX_REQUESTS: 1500
    VISIBILITY_MAX_TOKENS: 2000000
    AGENT_MAX_TOTAL_TOKENS: 1000000
    AGENT_MAX_OUTPUT_TOKENS: 16384
    AGENT_MAX_TURNS: 0
    AGENT_MAX_TOOL_CALLS: 0
    AGENT_TIMEOUT_SECONDS: 0
    AGENT_CONTEXT_MAX_BYTES: 120000
    SCAN_NODE_IMAGE: node:24.19.0-bookworm-slim
  secret:
    - RAILS_MASTER_KEY
    - SECRET_KEY_BASE
    - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
    - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
    - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
    - DATABASE_URL
    - QUEUE_DATABASE_URL
    - CACHE_DATABASE_URL
    - CABLE_DATABASE_URL
    - GOOGLE_AI_STUDIO_API_KEY
    - GITHUB_APP_ID
    - GITHUB_APP_SLUG
    - GITHUB_CLIENT_ID
    - GITHUB_CLIENT_SECRET
    - GITHUB_APP_PRIVATE_KEY
    - GITHUB_WEBHOOK_SECRET
volumes:
  - /srv/fortop/storage:/rails/storage
asset_path: /rails/public/assets
deploy_timeout: 120
builder:
  arch: amd64
ssh:
  user: <%= deployment.fetch("ssh_user") %>
  keys:
    - ~/.ssh/google_compute_engine
  keys_only: true
  proxy_command: gcloud compute start-iap-tunnel <%= deployment.fetch("instance") %> 22 --listen-on-stdin --project=<%= deployment.fetch("project") %> --zone=<%= deployment.fetch("zone") %> --quiet
accessories:
  db:
    image: postgres:17-alpine
    host: <%= deployment.fetch("ip") %>
    env:
      clear:
        POSTGRES_USER: postgres
        POSTGRES_DB: postgres
      secret:
        - POSTGRES_PASSWORD:POSTGRES_ADMIN_PASSWORD
        - FORTOP_DATABASE_PASSWORD
    files:
      - infra/gcp/init-databases.sh:/docker-entrypoint-initdb.d/10-fortop.sh
    directories:
      - /srv/fortop/postgres:/var/lib/postgresql/data
    options:
      memory: 512m
    cmd: postgres -c shared_buffers=128MB -c max_connections=60
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  logs: app logs -f
